<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RunTrainer">
<link rel="manifest" href="manifest.webmanifest">
<title>Run Trainer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
.app{max-width:560px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
h1{text-align:center;margin:2px 0;font-size:25px}.ver{text-align:center;color:#777;font-size:12px;margin-bottom:12px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.nav button{border:0;border-radius:12px;padding:12px;font-weight:800;background:#333;color:#ddd}
.nav button.active{background:#fff;color:#111}
.card{background:#1d1d1f;padding:15px;border-radius:18px;margin:12px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;color:#aaa;font-size:13px;margin:9px 0}
input,select{width:100%;padding:12px;margin-top:5px;border:0;border-radius:10px;font-size:17px;background:#fff;color:#111}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#333;padding:4px;border-radius:12px}
.segment button{border:0;border-radius:9px;padding:11px;background:transparent;color:#ddd;font-weight:800}
.segment button.on{background:#fff;color:#111}
.btn{border:0;border-radius:11px;padding:12px;font-weight:800}.start{width:100%;font-size:24px;padding:19px;background:#fff;color:#111}
.test{width:100%;background:#666;color:#fff;margin-top:4px}
.hidden{display:none!important}
.screen{text-align:center;padding:30px 12px;border-radius:20px;background:#6d1717}.screen.walk{background:#155b2a}.screen.goal{background:#333}
.phase{font-size:48px;font-weight:900}.clock{font-size:84px;font-weight:900}.sub{margin-top:8px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.controls button{border:0;border-radius:12px;padding:12px;font-weight:800}
.pause{grid-column:1/-1;font-size:30px!important;padding:25px!important;background:#fff;color:#111}
.finish{grid-column:1/-1;background:#555;color:#fff}
.historyRow{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #333}
.historyRow:last-child{border-bottom:0}.muted{color:#999;font-size:12px}
.empty{color:#888;padding:12px 0}
.savepanel{background:#222;border-radius:18px;padding:16px;margin-top:14px}
.savepanel h2{margin-top:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{border:0;border-radius:11px;padding:13px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<h1>Run Trainer</h1><div class="ver">v0.5 test</div>

<div id="topNav" class="nav">
<button id="navWorkout" class="active">Workout</button>
<button id="navActivity">Activity</button>
</div>

<section id="workoutPage">
<div id="setup">
<div class="card">
<label>Workout mode</label>
<div class="segment"><button id="mi" class="on">Interval</button><button id="mc">Continuous</button></div>
</div>

<div class="card">
<label>Goal time (minutes)<input id="goal" type="number" min="1" value="20"></label>

<div id="ints" class="row">
<label>Run<input id="run" type="number" min=".1" step=".1" value="4"></label>
<label>Walk<input id="walk" type="number" min=".1" step=".1" value="1"></label>
</div>

<label id="halfLabel" class="hidden"><input id="half" type="checkbox" checked style="width:auto"> Halfway announcement</label>

<label id="styleLabel">Command style
<select id="style">
<option value="Walk|Run">Walk / Run</option>
<option value="Slap af|Gi den gas">Slap af / Gi den gas</option>
<option value="Whoa baby|Giddy up">Whoa baby / Giddy up</option>
<option value="Easy|Push it">Easy / Push it</option>
<option value="custom">Custom</option>
</select></label>

<div id="custom" class="row hidden">
<label>Walk cue<input id="wc" type="text" value="Walk"></label>
<label>Run cue<input id="rc" type="text" value="Run"></label>
</div>

<label>Voice
<select id="voiceSelect"><option value="">Default device voice</option></select>
</label>
<button id="testVoice" class="btn test">Test voice</button>

<button id="start" class="btn start" style="margin-top:14px">START</button>
</div>
</div>

<div id="active" class="hidden">
<div id="screen" class="screen">
<div id="phase" class="phase">RUN</div>
<div id="clock" class="clock">00:00</div>
<div id="sub" class="sub"></div>
</div>
<div class="controls">
<button id="reset">Reset</button>
<button id="next">Next</button>
<button id="pause" class="pause">PAUSE</button>
<button id="finish" class="finish">FINISH</button>
</div>
</div>

<div id="savePanel" class="savepanel hidden">
<h2>Save activity?</h2>
<div id="summary"></div>
<div class="actions" style="margin-top:12px">
<button id="discard">Don't save</button>
<button id="save">Save</button>
</div>
</div>
</section>

<section id="activityPage" class="hidden">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<strong>Saved activity</strong>
<button id="clearHistory" class="btn" style="background:#555;color:#fff">Clear</button>
</div>
<div id="history"></div>
</div>
</section>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
let mode='i',state='idle',phase='RUN',startAt=0,pausedMs=0,pauseAt=0,phaseEnd=0;
let goalS=1200,runS=240,walkS=60,timer=null,halfDone=false,goalDone=false,counted=new Set(),finishedDuration=0;
let voices=[];

const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const elapsed=()=>((state==='paused'?pauseAt:Date.now())-startAt-pausedMs)/1000;

function showPage(page){
 const activity=page==='activity';
 $('workoutPage').classList.toggle('hidden',activity);
 $('activityPage').classList.toggle('hidden',!activity);
 $('navWorkout').classList.toggle('active',!activity);
 $('navActivity').classList.toggle('active',activity);
 if(activity)renderHistory();
}
$('navWorkout').onclick=()=>showPage('workout');
$('navActivity').onclick=()=>showPage('activity');

function populateVoices(){
 voices=speechSynthesis.getVoices()||[];
 const saved=localStorage.getItem('rt-v05-voice')||'';
 $('voiceSelect').innerHTML='<option value="">Default device voice</option>';
 voices.forEach((v,i)=>{
   if(/^en|^da/i.test(v.lang)){
     const o=document.createElement('option');
     o.value=String(i);o.textContent=v.name+' ('+v.lang+')';
     $('voiceSelect').appendChild(o);
   }
 });
 if(saved&&[...$('voiceSelect').options].some(o=>o.value===saved))$('voiceSelect').value=saved;
}
if('speechSynthesis'in window){
 populateVoices();speechSynthesis.onvoiceschanged=populateVoices;setTimeout(populateVoices,500);
}
function say(text){
 try{
  const u=new SpeechSynthesisUtterance(text);
  const val=$('voiceSelect').value;
  if(val!==''&&voices[Number(val)])u.voice=voices[Number(val)];
  u.rate=.9;u.volume=1;speechSynthesis.speak(u);
 }catch(e){}
}
function beep(freq=760){
 try{
  const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);o.frequency.value=freq;g.gain.value=.1;o.start();
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.1);o.stop(c.currentTime+.1);
 }catch(e){}
}
function cue(){
 if($('style').value==='custom')return phase==='RUN'?($('rc').value||'Run'):($('wc').value||'Walk');
 const a=$('style').value.split('|');return phase==='RUN'?a[1]:a[0];
}
function setMode(m){
 mode=m;$('mi').classList.toggle('on',m==='i');$('mc').classList.toggle('on',m==='c');
 $('ints').classList.toggle('hidden',m==='c');$('halfLabel').classList.toggle('hidden',m==='i');
 $('styleLabel').classList.toggle('hidden',m==='c');$('custom').classList.toggle('hidden',m==='c'||$('style').value!=='custom');
 $('next').classList.toggle('hidden',m==='c');
}
$('mi').onclick=()=>setMode('i');$('mc').onclick=()=>setMode('c');
$('style').onchange=()=>setMode(mode);
$('voiceSelect').onchange=()=>localStorage.setItem('rt-v05-voice',$('voiceSelect').value);
$('testVoice').onclick=()=>{
 if(mode==='i'){
  const original=phase;
  phase='WALK'; const w=cue();
  phase='RUN'; const r=cue();
  phase=original;
  say(w);setTimeout(()=>say(r),900);
 }else say('Run');
};

function newPhase(p){
 phase=p;const d=p==='RUN'?runS:walkS;phaseEnd=Date.now()+d*1000;counted.clear();beep(900);setTimeout(()=>say(cue()),90);
}
$('start').onclick=()=>{
 goalS=Number($('goal').value)*60;runS=Number($('run').value)*60;walkS=Number($('walk').value)*60;
 if(!(goalS>0)||mode==='i'&&(!(runS>0)||!(walkS>0))){alert('Check workout times.');return}
 startAt=Date.now();pausedMs=0;halfDone=false;goalDone=false;finishedDuration=0;state='run';
 $('setup').classList.add('hidden');$('savePanel').classList.add('hidden');$('active').classList.remove('hidden');
 if(mode==='i')newPhase('RUN');else say('Run');
 timer=setInterval(tick,150);tick();
};
function tick(){
 if(state!=='run')return;
 const e=elapsed();
 if(mode==='c'){
  $('screen').className='screen '+(goalDone?'goal':'');
  $('phase').textContent=goalDone?'GOAL REACHED':'RUN';
  $('clock').textContent=fmt(e);
  $('sub').textContent=goalDone?'Keep going — finish when ready':'Goal '+fmt(goalS);
  if($('half').checked&&!halfDone&&e>=goalS/2){halfDone=true;say('Halfway')}
  if(!goalDone&&e>=goalS){goalDone=true;beep(1000);setTimeout(()=>say('Goal reached'),100)}
 }else{
  let left=(phaseEnd-Date.now())/1000;
  if(left<=0){newPhase(phase==='RUN'?'WALK':'RUN');left=phase==='RUN'?runS:walkS}
  if(left<=3&&left>0){const n=Math.ceil(left);if(!counted.has(n)){counted.add(n);beep(n===1?1050:700)}}
  $('screen').className='screen '+(phase==='WALK'?'walk':'');
  $('phase').textContent=phase;$('clock').textContent=fmt(left);
  $('sub').textContent=(e>=goalS?'Goal reached • ':'Elapsed ')+fmt(e);
  if(!goalDone&&e>=goalS){goalDone=true;say('Goal reached')}
 }
}
$('pause').onclick=()=>{
 if(state==='run'){state='paused';pauseAt=Date.now();clearInterval(timer);$('pause').textContent='RESUME'}
 else if(state==='paused'){const d=Date.now()-pauseAt;pausedMs+=d;if(mode==='i')phaseEnd+=d;state='run';timer=setInterval(tick,150);$('pause').textContent='PAUSE';tick()}
};
$('next').onclick=()=>{if(mode==='i'&&(state==='run'||state==='paused'))newPhase(phase==='RUN'?'WALK':'RUN')};

function finish(savePrompt){
 clearInterval(timer);finishedDuration=Math.max(0,elapsed());state='finished';
 $('active').classList.add('hidden');
 if(savePrompt){
  $('summary').textContent='Time: '+fmt(finishedDuration)+' · '+(mode==='i'?'Interval':'Continuous');
  $('savePanel').classList.remove('hidden');
 } else returnToSetup();
}
function returnToSetup(){
 clearInterval(timer);state='idle';finishedDuration=0;
 $('savePanel').classList.add('hidden');$('active').classList.add('hidden');$('setup').classList.remove('hidden');$('pause').textContent='PAUSE';
}
$('finish').onclick=()=>finish(true);
$('reset').onclick=()=>{if(confirm('Reset without saving?'))finish(false)};
$('discard').onclick=()=>returnToSetup();
$('save').onclick=()=>{
 try{
  let h=JSON.parse(localStorage.getItem('rt-v05-history')||'[]');if(!Array.isArray(h))h=[];
  h.unshift({at:new Date().toISOString(),sec:finishedDuration,mode:mode});
  localStorage.setItem('rt-v05-history',JSON.stringify(h));
 }catch(e){alert('Could not save activity.');return}
 returnToSetup();
 showPage('activity');
};
function renderHistory(){
 let h=[];try{h=JSON.parse(localStorage.getItem('rt-v05-history')||'[]');if(!Array.isArray(h))h=[]}catch(e){}
 $('history').innerHTML='';
 if(!h.length){$('history').innerHTML='<div class="empty">No saved activities yet.</div>';return}
 h.forEach((r,i)=>{
  const d=new Date(r.at),row=document.createElement('div');row.className='historyRow';
  row.innerHTML='<div>#'+(h.length-i)+'</div><div><div>'+d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})+'</div><div class="muted">'+(r.mode==='i'?'Interval':'Continuous')+'</div></div><div><strong>'+fmt(r.sec)+'</strong></div>';
  $('history').appendChild(row);
 });
}
$('clearHistory').onclick=()=>{if(confirm('Clear all saved activity?')){localStorage.removeItem('rt-v05-history');renderHistory()}};

setMode('i');$('savePanel').classList.add('hidden');renderHistory();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
})();
</script>
</body>
</html>
