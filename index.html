<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Run Trainer</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#111;color:#fff;font-family:-apple-system,Arial,sans-serif}.app{max-width:560px;margin:auto;padding:16px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nav button,.btn{border:0;border-radius:11px;padding:12px;font-weight:800}.nav button{background:#333;color:#ddd}.nav .on{background:#fff;color:#111}.card{background:#1d1d1f;padding:15px;border-radius:18px;margin:12px 0}.hidden{display:none!important}label{display:block;color:#aaa;font-size:13px;margin:10px 0}input,select{width:100%;padding:12px;margin-top:5px;border:0;border-radius:10px;font-size:17px;background:#fff;color:#111}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.start{width:100%;font-size:24px;padding:18px;background:#fff;color:#111}.secondary{background:#666;color:#fff}.danger{background:#543030;color:#fff}.title{text-align:center;font-size:25px;font-weight:800}.ver{text-align:center;color:#777;font-size:12px}.chip{display:inline-block;background:#333;border-radius:999px;padding:6px 10px;font-size:13px;color:#ddd}.workoutName{font-size:23px;font-weight:800;margin-top:10px}.muted{color:#aaa;margin-top:6px}.screen{text-align:center;padding:30px 12px;border-radius:20px;background:#6d1717}.screen.a{background:#155b2a}.screen.goal{background:#333}.phase{font-size:48px;font-weight:900}.clock{font-size:84px;font-weight:900}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.pause{grid-column:1/-1;font-size:30px;padding:25px;background:#fff;color:#111}.finish{grid-column:1/-1;background:#555;color:#fff}.history{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #333}.empty{color:#888;padding:12px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body><div class="app"><div class="title">Run Trainer</div><div class="ver">v0.6.1 IndexedDB</div><div class="nav"><button id="nw" class="on">Workout</button><button id="na">Activity</button><button id="ns">Setup</button></div>
<section id="workoutPage"><div id="summaryCard" class="card"><div id="modeChip" class="chip"></div><div id="summaryName" class="workoutName"></div><div id="summaryGoal" class="muted"></div><div id="summaryPhases" class="muted"></div><button id="start" class="btn start" style="margin-top:16px">START</button></div><div id="active" class="hidden"><div id="screen" class="screen"><div id="phase" class="phase">RUN</div><div id="clock" class="clock">00:00</div><div id="sub" class="muted"></div></div><div class="controls"><button id="reset" class="btn">Reset</button><button id="next" class="btn">Next</button><button id="pause" class="btn pause">PAUSE</button><button id="finish" class="btn finish">FINISH</button></div></div><div id="savePanel" class="card hidden"><h2>Save activity?</h2><div id="saveSummary"></div><div class="actions"><button id="discard" class="btn secondary">Don't save</button><button id="save" class="btn">Save</button></div></div></section>
<section id="activityPage" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Saved activity</strong><button id="clear" class="btn danger">Clear</button></div><div id="history"></div></div></section>
<section id="setupPage" class="hidden"><div class="card"><label>Saved workout<select id="preset"></select></label><div class="actions"><button id="newPreset" class="btn secondary">New workout</button><button id="deletePreset" class="btn danger">Delete</button></div></div><div class="card"><label>Workout name<input id="name"></label><label>Workout mode<select id="mode"><option value="interval">Interval</option><option value="continuous">Continuous</option></select></label><label>Goal time (minutes)<input id="goal" type="number" min="1"></label><div id="intervalSetup"><label>Phase A name<input id="aName"></label><div class="row"><label>Minutes<select id="aMin"></select></label><label>Seconds<select id="aSec"></select></label></div><label>Phase B name<input id="bName"></label><div class="row"><label>Minutes<select id="bMin"></select></label><label>Seconds<select id="bSec"></select></label></div></div><div id="continuousSetup" class="hidden"><label><input id="half" type="checkbox" checked style="width:auto"> Halfway announcement</label></div></div><div class="card"><label>Voice<select id="voice"><option value="">Default device voice</option></select></label><button id="testVoice" class="btn secondary" style="width:100%">Test voice</button><div class="muted" style="font-size:12px">Settings and workout presets are stored locally. Activity history is stored in IndexedDB on this device.</div></div><button id="saveSetup" class="btn start">SAVE WORKOUT</button></section></div>
<script>
(()=>{const $=x=>document.getElementById(x);const defaults=[{id:'return',name:'Return to Running',mode:'interval',goal:20,aName:'Walk',aSec:60,bName:'Run',bSec:120,half:true},{id:'steady',name:'Steady Run',mode:'continuous',goal:30,aName:'',aSec:0,bName:'Run',bSec:0,half:true},{id:'speed',name:'Speed Session',mode:'interval',goal:20,aName:'Jog',aSec:90,bName:'Sprint',bSec:30,half:true}];let voices=[],state='idle',phase='B',startAt=0,pauseAt=0,pausedMs=0,phaseEnd=0,timer=null,counted=new Set(),finished=0,halfDone=false,goalDone=false,currentId=null,dbP=null;const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};const elapsed=()=>((state==='paused'?pauseAt:Date.now())-startAt-pausedMs)/1000;
function openDb(){if(dbP)return dbP;dbP=new Promise((res,rej)=>{const r=indexedDB.open('RunTrainerDB',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('activities')){const s=db.createObjectStore('activities',{keyPath:'id',autoIncrement:true});s.createIndex('at','at')}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbP}async function addActivity(a){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction('activities','readwrite');tx.objectStore('activities').add(a);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function getActivities(){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction('activities','readonly'),r=tx.objectStore('activities').getAll();r.onsuccess=()=>res((r.result||[]).sort((a,b)=>new Date(b.at)-new Date(a.at)));r.onerror=()=>rej(r.error)})}async function clearActivities(){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction('activities','readwrite');tx.objectStore('activities').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function migrate(){if(localStorage.getItem('rt6-migrated')==='1')return;let old=[];try{old=JSON.parse(localStorage.getItem('rt6-history')||'[]')}catch(e){}if(Array.isArray(old))for(const r of old)await addActivity({at:r.at||new Date().toISOString(),sec:Number(r.sec)||0,presetName:r.presetName||'Workout',mode:r.mode||'interval'});localStorage.setItem('rt6-migrated','1')}
function presets(){try{let p=JSON.parse(localStorage.getItem('rt6-presets')||'null');if(Array.isArray(p)&&p.length)return p}catch(e){}localStorage.setItem('rt6-presets',JSON.stringify(defaults));return defaults.slice()}function setPresets(p){localStorage.setItem('rt6-presets',JSON.stringify(p))}function settings(){try{return JSON.parse(localStorage.getItem('rt6-settings')||'{}')}catch(e){return{}}}function setSettings(s){localStorage.setItem('rt6-settings',JSON.stringify(s))}
['aMin','bMin'].forEach(id=>{for(let i=0;i<=10;i++)$(id).add(new Option(i,i))});['aSec','bSec'].forEach(id=>{for(let s=0;s<60;s+=10)$(id).add(new Option(String(s).padStart(2,'0'),s))});function populateVoices(){voices=speechSynthesis.getVoices()||[];let saved=settings().voice||'';$('voice').innerHTML='<option value="">Default device voice</option>';voices.forEach((v,i)=>{if(/^en|^da/i.test(v.lang))$('voice').add(new Option(v.name+' ('+v.lang+')',i))});if(saved&&[...$('voice').options].some(o=>o.value===saved))$('voice').value=saved}if('speechSynthesis'in window){populateVoices();speechSynthesis.onvoiceschanged=populateVoices;setTimeout(populateVoices,500)}function say(t){try{let u=new SpeechSynthesisUtterance(t),v=$('voice').value;if(v!==''&&voices[+v])u.voice=voices[+v];u.rate=.9;speechSynthesis.speak(u)}catch(e){}}function beep(f=760){try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.1;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.1);o.stop(c.currentTime+.1)}catch(e){}}
function show(page){['workout','activity','setup'].forEach(p=>{$(p+'Page').classList.toggle('hidden',p!==page);$('n'+p[0]).classList.toggle('on',p===page)});if(page==='activity')renderHistory();if(page==='setup')refreshPreset();if(page==='workout')renderSummary()}$('nw').onclick=()=>show('workout');$('na').onclick=()=>show('activity');$('ns').onclick=()=>show('setup');
function refreshPreset(){let p=presets(),s=$('preset');s.innerHTML='';p.forEach(x=>s.add(new Option(x.name,x.id)));let saved=settings().currentId;currentId=p.some(x=>x.id===saved)?saved:p[0].id;s.value=currentId;loadPreset(currentId)}function loadPreset(id){let p=presets().find(x=>x.id===id);if(!p)return;currentId=id;$('name').value=p.name;$('mode').value=p.mode;$('goal').value=p.goal;$('aName').value=p.aName||'Easy';$('bName').value=p.bName||'Hard';$('half').checked=p.half!==false;$('aMin').value=Math.floor((p.aSec||0)/60);$('aSec').value=(p.aSec||0)%60;$('bMin').value=Math.floor((p.bSec||0)/60);$('bSec').value=(p.bSec||0)%60;modeUI()}$('preset').onchange=()=>{loadPreset($('preset').value);let s=settings();s.currentId=$('preset').value;setSettings(s)};$('mode').onchange=modeUI;function modeUI(){let i=$('mode').value==='interval';$('intervalSetup').classList.toggle('hidden',!i);$('continuousSetup').classList.toggle('hidden',i)}$('newPreset').onclick=()=>{let p=presets(),id='custom-'+Date.now();p.push({id,name:'New Workout',mode:'interval',goal:20,aName:'Easy',aSec:60,bName:'Hard',bSec:60,half:true});setPresets(p);let s=settings();s.currentId=id;setSettings(s);refreshPreset();$('preset').value=id;loadPreset(id)};$('deletePreset').onclick=()=>{let p=presets();if(p.length<=1)return alert('Keep at least one workout.');if(!confirm('Delete this workout?'))return;p=p.filter(x=>x.id!==$('preset').value);setPresets(p);let s=settings();s.currentId=p[0].id;setSettings(s);refreshPreset()};$('saveSetup').onclick=()=>{let a=+$('aMin').value*60 + +$('aSec').value,b=+$('bMin').value*60 + +$('bSec').value;if($('mode').value==='interval'&&(a<=0||b<=0))return alert('Both interval phases need a time.');let p=presets(),i=p.findIndex(x=>x.id===currentId),obj={id:currentId,name:$('name').value.trim()||'Workout',mode:$('mode').value,goal:+$('goal').value,aName:$('aName').value.trim()||'Easy',aSec:a,bName:$('bName').value.trim()||'Hard',bSec:b,half:$('half').checked};if(i>=0)p[i]=obj;else p.push(obj);setPresets(p);let s=settings();s.currentId=currentId;s.voice=$('voice').value;setSettings(s);show('workout')};$('voice').onchange=()=>{let s=settings();s.voice=$('voice').value;setSettings(s)};$('testVoice').onclick=()=>{let p=presets().find(x=>x.id===currentId);if(!p)return;if(p.mode==='interval'){say(p.aName);setTimeout(()=>say(p.bName),900)}else say(p.bName||'Run')};
function current(){let p=presets(),id=settings().currentId;return p.find(x=>x.id===id)||p[0]}function renderSummary(){let p=current();$('modeChip').textContent=p.mode==='interval'?'Interval':'Continuous';$('summaryName').textContent=p.name;$('summaryGoal').textContent=p.goal+' min goal';$('summaryPhases').textContent=p.mode==='interval'?(p.aName+' '+fmt(p.aSec)+' / '+p.bName+' '+fmt(p.bSec)):('Steady '+(p.bName||'Run'))}function startPhase(which,p){phase=which;let d=which==='A'?p.aSec:p.bSec;phaseEnd=Date.now()+d*1000;counted.clear();beep(900);setTimeout(()=>say(which==='A'?p.aName:p.bName),90)}$('start').onclick=()=>{let p=current();startAt=Date.now();pausedMs=0;finished=0;halfDone=false;goalDone=false;state='run';$('summaryCard').classList.add('hidden');$('savePanel').classList.add('hidden');$('active').classList.remove('hidden');$('next').classList.toggle('hidden',p.mode!=='interval');if(p.mode==='interval')startPhase('B',p);else say(p.bName||'Run');timer=setInterval(()=>tick(p),150);tick(p)};function tick(p){if(state!=='run')return;let e=elapsed(),goal=p.goal*60;if(p.mode==='continuous'){$('screen').className='screen '+(goalDone?'goal':'');$('phase').textContent=goalDone?'GOAL REACHED':(p.bName||'RUN').toUpperCase();$('clock').textContent=fmt(e);$('sub').textContent=goalDone?'Keep going — finish when ready':'Goal '+fmt(goal);if(p.half&&!halfDone&&e>=goal/2){halfDone=true;say('Halfway')}if(!goalDone&&e>=goal){goalDone=true;beep(1000);setTimeout(()=>say('Goal reached'),100)}}else{let left=(phaseEnd-Date.now())/1000;if(left<=0){startPhase(phase==='A'?'B':'A',p);left=phase==='A'?p.aSec:p.bSec}if(left<=3&&left>0){let n=Math.ceil(left);if(!counted.has(n)){counted.add(n);beep(n===1?1050:700)}}let label=phase==='A'?p.aName:p.bName;$('screen').className='screen '+(phase==='A'?'a':'');$('phase').textContent=label.toUpperCase();$('clock').textContent=fmt(left);$('sub').textContent=(e>=goal?'Goal reached • ':'Elapsed ')+fmt(e);if(!goalDone&&e>=goal){goalDone=true;say('Goal reached')}}}$('pause').onclick=()=>{let p=current();if(state==='run'){state='paused';pauseAt=Date.now();clearInterval(timer);$('pause').textContent='RESUME'}else if(state==='paused'){let d=Date.now()-pauseAt;pausedMs+=d;if(p.mode==='interval')phaseEnd+=d;state='run';timer=setInterval(()=>tick(p),150);$('pause').textContent='PAUSE';tick(p)}};$('next').onclick=()=>{let p=current();if(p.mode==='interval'&&(state==='run'||state==='paused'))startPhase(phase==='A'?'B':'A',p)};function finish(savePrompt){clearInterval(timer);finished=Math.max(0,elapsed());state='finished';$('active').classList.add('hidden');if(savePrompt){let p=current();$('saveSummary').textContent='Time: '+fmt(finished)+' · '+p.name;$('savePanel').classList.remove('hidden')}else resetUI()}function resetUI(){clearInterval(timer);state='idle';finished=0;$('savePanel').classList.add('hidden');$('active').classList.add('hidden');$('summaryCard').classList.remove('hidden');$('pause').textContent='PAUSE'}$('finish').onclick=()=>finish(true);$('reset').onclick=()=>{if(confirm('Reset without saving?'))finish(false)};$('discard').onclick=resetUI;$('save').onclick=async()=>{let p=current();try{await addActivity({at:new Date().toISOString(),sec:finished,presetName:p.name,mode:p.mode})}catch(e){return alert('Could not save activity.')}resetUI();show('activity')};async function renderHistory(){let h=[];try{h=await getActivities()}catch(e){$('history').innerHTML='<div class="empty">Could not read activity history.</div>';return}$('history').innerHTML='';if(!h.length){$('history').innerHTML='<div class="empty">No saved activities yet.</div>';return}h.forEach(r=>{let d=new Date(r.at),row=document.createElement('div');row.className='history';row.innerHTML='<div><strong>'+r.presetName+'</strong><div class="muted">'+d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' · '+(r.mode==='interval'?'Interval':'Continuous')+'</div></div><div><strong>'+fmt(r.sec)+'</strong></div>';$('history').appendChild(row)})}$('clear').onclick=async()=>{if(confirm('Clear all saved activity?')){try{await clearActivities();renderHistory()}catch(e){alert('Could not clear activity history.')}}};(async()=>{try{await openDb();await migrate()}catch(e){}refreshPreset();renderSummary();renderHistory()})();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));})();
</script></body></html>
