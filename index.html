<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RunWalk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Run / Walk Timer</title>
<style>
  :root{--bg:#111;--panel:#1b1b1b;--text:#fff;--muted:#bbb;--run:#8b0000;--walk:#0b5d1e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
  body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
  .app{width:min(560px,100%);padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
  h1{font-size:24px;text-align:center;margin:0 0 12px}
  .card{background:var(--panel);border-radius:18px;padding:14px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .full{grid-column:1/-1}
  label{font-size:12px;color:var(--muted)}
  input[type=number]{width:100%;margin-top:5px;padding:12px;border:0;border-radius:12px;font-size:20px;text-align:center}
  .toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:5px;color:#ddd;font-size:15px}
  .toggle input{transform:scale(1.3)}
  .status{border-radius:22px;padding:26px 14px;text-align:center;background:#222;transition:background .15s}
  .status.run{background:var(--run)}
  .status.walk{background:var(--walk)}
  .status.done{background:#333}
  .phase{font-weight:900;font-size:54px;letter-spacing:1px}
  .time{font-weight:900;font-size:92px;line-height:1}
  .small{font-size:18px;margin-top:10px}
  .progress{height:12px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:15px}
  .bar{height:100%;width:0;background:#fff}
  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  button{border:0;border-radius:14px;padding:17px 12px;font-size:20px;font-weight:800}
  .primary{background:#fff;color:#111}
  .secondary{background:#ddd;color:#111}
  .danger{background:#555;color:#fff}
  .wide{grid-column:1/-1}
  .installnote{font-size:12px;color:#999;text-align:center;margin-top:10px;line-height:1.4}
  body.running .card{display:none}
  body.running h1{display:none}
  body.running .app{display:flex;min-height:100dvh;flex-direction:column;justify-content:center}
  body.running .status{padding:34px 14px}
  body.running .phase{font-size:64px}
  body.running .time{font-size:104px}
  body.running .buttons{margin-top:14px}
  @media(max-width:430px){
    .time{font-size:78px}
    .phase{font-size:48px}
    body.running .time{font-size:88px}
    body.running .phase{font-size:58px}
  }
</style>
</head>
<body>
<div class="app">
  <h1>Run / Walk Timer</h1>

  <div class="card grid">
    <label class="full">Total workout (minutes)
      <input id="totalMin" type="number" min="1" step="1" value="20">
    </label>
    <label>Run (minutes)
      <input id="runMin" type="number" min="0.1" step="0.1" value="4">
    </label>
    <label>Walk (minutes)
      <input id="walkMin" type="number" min="0.1" step="0.1" value="1">
    </label>

    <div class="toggle full"><span>Voice prompts</span><input id="voice" type="checkbox" checked></div>
    <div class="toggle full"><span>Beep at interval change</span><input id="beep" type="checkbox" checked></div>
    <div class="toggle full"><span>5-second spoken countdown</span><input id="countdown" type="checkbox" checked></div>
  </div>

  <div id="status" class="status">
    <div id="phase" class="phase">READY</div>
    <div id="phaseTime" class="time">--:--</div>
    <div id="totalTime" class="small">Total remaining: --:--</div>
    <div class="progress"><div id="bar" class="bar"></div></div>
  </div>

  <div class="buttons">
    <button id="start" class="primary wide">Start</button>
    <button id="skip" class="secondary">Skip</button>
    <button id="stop" class="danger">Stop</button>
    <button id="reset" class="danger wide">Reset</button>
  </div>

  <div class="installnote">Tip: install from Safari → Share → Add to Home Screen.</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const totalInput=$('totalMin'),runInput=$('runMin'),walkInput=$('walkMin');
  const voiceInput=$('voice'),beepInput=$('beep'),countdownInput=$('countdown');
  const status=$('status'),phaseEl=$('phase'),phaseTimeEl=$('phaseTime'),totalTimeEl=$('totalTime'),bar=$('bar');
  const startBtn=$('start'),skipBtn=$('skip'),stopBtn=$('stop'),resetBtn=$('reset');

  let state='idle', phase='RUN', totalSec=1200, runSec=240, walkSec=60;
  let workoutEnd=0, phaseEnd=0, pausedWorkoutLeft=0, pausedPhaseLeft=0, intervalDuration=0;
  let tickHandle=null, wakeLock=null, spokenCountdown=new Set();

  const now=()=>Date.now();
  const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator){
        wakeLock=await navigator.wakeLock.request('screen');
      }
    }catch(e){}
  }
  function releaseWakeLock(){try{if(wakeLock)wakeLock.release()}catch(e){} wakeLock=null;}

  function say(text){
    if(!voiceInput.checked) return;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.rate=1; u.volume=1;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  function beep(){
    if(!beepInput.checked) return;
    try{
      const C=window.AudioContext||window.webkitAudioContext;
      const c=new C(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);o.frequency.value=880;
      g.gain.setValueAtTime(.18,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);
      o.start();o.stop(c.currentTime+.3);
    }catch(e){}
  }

  function save(){
    localStorage.setItem('runwalk-pwa-settings',JSON.stringify({
      total:totalInput.value,run:runInput.value,walk:walkInput.value,
      voice:voiceInput.checked,beep:beepInput.checked,countdown:countdownInput.checked
    }));
  }
  function load(){
    try{
      const s=JSON.parse(localStorage.getItem('runwalk-pwa-settings')||'{}');
      if(s.total) totalInput.value=s.total;
      if(s.run) runInput.value=s.run;
      if(s.walk) walkInput.value=s.walk;
      if(typeof s.voice==='boolean') voiceInput.checked=s.voice;
      if(typeof s.beep==='boolean') beepInput.checked=s.beep;
      if(typeof s.countdown==='boolean') countdownInput.checked=s.countdown;
    }catch(e){}
  }

  function readConfig(){
    const t=Number(totalInput.value),r=Number(runInput.value),w=Number(walkInput.value);
    if(!(t>0&&r>0&&w>0)){alert('Enter values greater than 0.');return false}
    totalSec=t*60;runSec=r*60;walkSec=w*60;save();return true;
  }

  function setStatusClass(extra=''){
    status.className='status'+(extra?' '+extra:'');
  }

  function render(){
    if(state==='idle'){
      document.body.classList.remove('running');
      setStatusClass();
      phaseEl.textContent='READY';phaseTimeEl.textContent='--:--';totalTimeEl.textContent='Total remaining: --:--';bar.style.width='0%';startBtn.textContent='Start';return;
    }
    if(state==='done'){
      document.body.classList.remove('running');
      setStatusClass('done');
      phaseEl.textContent='FINISHED';phaseTimeEl.textContent='00:00';totalTimeEl.textContent='Total remaining: 00:00';bar.style.width='100%';startBtn.textContent='Start new workout';return;
    }

    document.body.classList.toggle('running',state==='running');
    setStatusClass(phase==='RUN'?'run':'walk');
    let totalLeft,phaseLeft;
    if(state==='paused'){totalLeft=pausedWorkoutLeft;phaseLeft=pausedPhaseLeft}
    else{
      const n=now();totalLeft=Math.max(0,(workoutEnd-n)/1000);phaseLeft=Math.max(0,(phaseEnd-n)/1000);
    }
    phaseEl.textContent=phase;
    phaseTimeEl.textContent=fmt(phaseLeft);
    totalTimeEl.textContent='Total remaining: '+fmt(totalLeft);
    const elapsed=Math.max(0,intervalDuration-phaseLeft);
    bar.style.width=Math.min(100,(elapsed/intervalDuration)*100)+'%';
    startBtn.textContent=state==='running'?'Pause':'Resume';
  }

  function startInterval(newPhase,totalLeft){
    phase=newPhase;
    intervalDuration=Math.min(newPhase==='RUN'?runSec:walkSec,totalLeft);
    phaseEnd=now()+intervalDuration*1000;
    spokenCountdown.clear();
    beep();say(newPhase==='RUN'?'Run':'Walk');
  }

  async function startWorkout(){
    if(!readConfig()) return;
    const n=now();
    workoutEnd=n+totalSec*1000;
    phase='RUN';intervalDuration=Math.min(runSec,totalSec);
    phaseEnd=n+intervalDuration*1000;
    state='running';spokenCountdown.clear();
    await requestWakeLock();
    beep();say('Run');
    startTicker();render();
  }

  function pause(){
    if(state!=='running') return;
    const n=now();
    pausedWorkoutLeft=Math.max(0,(workoutEnd-n)/1000);
    pausedPhaseLeft=Math.max(0,(phaseEnd-n)/1000);
    state='paused';stopTicker();releaseWakeLock();render();
  }

  async function resume(){
    if(state!=='paused') return;
    const n=now();
    workoutEnd=n+pausedWorkoutLeft*1000;
    phaseEnd=n+pausedPhaseLeft*1000;
    state='running';
    await requestWakeLock();
    startTicker();render();
  }

  function finish(){
    state='done';stopTicker();releaseWakeLock();beep();say('Workout finished');render();
  }

  function skip(){
    if(state!=='running'&&state!=='paused') return;
    let totalLeft;
    if(state==='paused'){
      totalLeft=pausedWorkoutLeft;
      phase=phase==='RUN'?'WALK':'RUN';
      pausedPhaseLeft=Math.min(phase==='RUN'?runSec:walkSec,totalLeft);
      intervalDuration=pausedPhaseLeft;
      spokenCountdown.clear();beep();say(phase==='RUN'?'Run':'Walk');render();return;
    }
    totalLeft=Math.max(0,(workoutEnd-now())/1000);
    if(totalLeft<=0){finish();return}
    startInterval(phase==='RUN'?'WALK':'RUN',totalLeft);
    render();
  }

  function tick(){
    if(state!=='running') return;
    const n=now(),totalLeft=(workoutEnd-n)/1000,phaseLeft=(phaseEnd-n)/1000;
    if(totalLeft<=0){finish();return}
    if(phaseLeft<=0){
      startInterval(phase==='RUN'?'WALK':'RUN',totalLeft);
      render();return;
    }
    if(countdownInput.checked && phaseLeft<=5){
      const v=Math.ceil(phaseLeft);
      if(v>=1&&!spokenCountdown.has(v)){spokenCountdown.add(v);say(String(v))}
    }
    render();
  }

  function startTicker(){stopTicker();tickHandle=setInterval(tick,200)}
  function stopTicker(){if(tickHandle){clearInterval(tickHandle);tickHandle=null}}

  startBtn.addEventListener('click',()=>{
    if(state==='idle'||state==='done') startWorkout();
    else if(state==='running') pause();
    else resume();
  });
  skipBtn.addEventListener('click',skip);
  stopBtn.addEventListener('click',finish);
  resetBtn.addEventListener('click',()=>{state='idle';stopTicker();releaseWakeLock();spokenCountdown.clear();render()});

  [totalInput,runInput,walkInput,voiceInput,beepInput,countdownInput].forEach(x=>x.addEventListener('change',save));

  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='visible'&&state==='running'){
      await requestWakeLock();
      tick();
    }
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
  }

  load();render();
})();
</script>
</body>
</html>
