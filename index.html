<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest">
<title>Run Trainer</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,Arial}.app{max-width:540px;margin:auto;padding:18px}.card{background:#1d1d1f;padding:15px;border-radius:18px;margin:12px 0}
h1{text-align:center}.ver{text-align:center;color:#888;font-size:12px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#333;padding:4px;border-radius:12px}.modes button,.btn{border:0;border-radius:10px;padding:13px;font-weight:800}.modes .on{background:white;color:#111}
label{display:block;color:#aaa;font-size:13px;margin:9px 0}input,select{width:100%;padding:12px;margin-top:5px;border:0;border-radius:10px;font-size:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start{width:100%;font-size:24px;padding:18px}.screen{text-align:center;padding:30px 12px;border-radius:20px;background:#6d1717}.walk{background:#155b2a}.phase{font-size:48px;font-weight:900}.clock{font-size:82px;font-weight:900}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.pause{grid-column:1/-1;font-size:30px;padding:25px}.finish{grid-column:1/-1}.hidden{display:none!important}.history{border-bottom:1px solid #333;padding:10px 0;display:flex;justify-content:space-between}
.savepanel{margin-top:14px;background:#222;border-radius:18px;padding:16px}
.savepanel h2{margin-top:0}
.saveactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.saveactions button{border:0;border-radius:11px;padding:14px;font-weight:800}
</style></head><body><div class="app"><h1>Run Trainer</h1><div class="ver">v0.4.4 startup/save fix</div>
<div id="setup"><div class="card"><div class="modes"><button id="mi" class="on">Interval</button><button id="mc">Continuous</button></div></div>
<div class="card"><label>Goal time (minutes)<input id="goal" type="number" value="20"></label>
<div id="ints" class="row"><label>Run<input id="run" type="number" step=".1" value="4"></label><label>Walk<input id="walk" type="number" step=".1" value="1"></label></div>
<label id="halfLabel" class="hidden"><input id="half" type="checkbox" checked style="width:auto"> Halfway announcement</label>
<label id="styleLabel">Command style<select id="style"><option value="Walk|Run">Walk / Run</option><option value="Slap af|Gi den gas">Slap af / Gi den gas</option><option value="Whoa baby|Giddy up">Whoa baby / Giddy up</option><option value="Easy|Push it">Easy / Push it</option><option value="custom">Custom</option></select></label>
<div id="custom" class="row hidden"><label>Walk cue<input id="wc" value="Walk"></label><label>Run cue<input id="rc" value="Run"></label></div>
<button id="start" class="btn start">START</button></div></div>
<div id="active" class="hidden"><div id="screen" class="screen"><div id="phase" class="phase">RUN</div><div id="clock" class="clock">00:00</div><div id="sub"></div></div>
<div class="controls"><button id="reset" class="btn">Reset</button><button id="next" class="btn">Next</button><button id="pause" class="btn pause">PAUSE</button><button id="finish" class="btn finish">FINISH RUN</button></div></div>
<div class="card"><b>Activity log</b><div id="history"></div></div><div id="savePanel" class="savepanel hidden" hidden>
<h2>Save run</h2>
<div id="summary"></div>
<label>Distance (km)<input id="dist" type="text" inputmode="decimal" placeholder="1.9"></label>
<div class="saveactions">
<button id="discard" class="btn">Don't save</button>
<button id="save" class="btn">Save run</button>
</div>
</div>
</div>
<script>
(()=>{const $=x=>document.getElementById(x);let mode='i',state='idle',phase='RUN',start=0,paused=0,pauseAt=0,phaseEnd=0,goalS=1200,runS=240,walkS=60,timer,half=false,goalHit=false,beeped=new Set(),finishedDuration=0;
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const elapsed=()=>((state==='paused'?pauseAt:Date.now())-start-paused)/1000;
function say(t){try{let u=new SpeechSynthesisUtterance(t);u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function beep(f=750){try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.1;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.1);o.stop(c.currentTime+.1)}catch(e){}}
function cue(){if($('style').value==='custom')return phase==='RUN'?$('rc').value:$('wc').value;let a=$('style').value.split('|');return phase==='RUN'?a[1]:a[0]}
function setMode(m){mode=m;$('mi').className=m==='i'?'on':'';$('mc').className=m==='c'?'on':'';$('ints').classList.toggle('hidden',m==='c');$('halfLabel').classList.toggle('hidden',m==='i');$('styleLabel').classList.toggle('hidden',m==='c');$('custom').classList.toggle('hidden',m==='c'||$('style').value!=='custom');$('next').classList.toggle('hidden',m==='c')}
$('mi').onclick=()=>setMode('i');$('mc').onclick=()=>setMode('c');$('style').onchange=()=>setMode(mode);
function newPhase(p){phase=p;let d=p==='RUN'?runS:walkS;phaseEnd=Date.now()+d*1000;beeped.clear();beep(900);setTimeout(()=>say(cue()),100)}
$('start').onclick=()=>{$('savePanel').classList.add('hidden');$('savePanel').hidden=true;goalS=+$('goal').value*60;runS=+$('run').value*60;walkS=+$('walk').value*60;start=Date.now();paused=0;half=false;goalHit=false;state='run';$('setup').classList.add('hidden');$('active').classList.remove('hidden');if(mode==='i')newPhase('RUN');else say('Run');timer=setInterval(tick,150);tick()};
function tick(){if(state!=='run')return;let e=elapsed();if(mode==='c'){$('phase').textContent=goalHit?'GOAL REACHED':'RUN';$('clock').textContent=fmt(e);$('sub').textContent=goalHit?'Keep going — finish when ready':'Goal '+fmt(goalS);if($('half').checked&&!half&&e>=goalS/2){half=true;say('Halfway')}if(!goalHit&&e>=goalS){goalHit=true;say('Goal reached')}}else{let left=(phaseEnd-Date.now())/1000;if(left<=0){newPhase(phase==='RUN'?'WALK':'RUN');left=phase==='RUN'?runS:walkS}if(left<=3){let n=Math.ceil(left);if(!beeped.has(n)){beeped.add(n);beep(n===1?1050:700)}}$('screen').className='screen '+(phase==='WALK'?'walk':'');$('phase').textContent=phase;$('clock').textContent=fmt(left);$('sub').textContent=(e>=goalS?'Goal reached • ':'Elapsed ')+fmt(e);if(!goalHit&&e>=goalS){goalHit=true;say('Goal reached')}}}
$('pause').onclick=()=>{if(state==='run'){state='paused';pauseAt=Date.now();clearInterval(timer);$('pause').textContent='RESUME'}else{let d=Date.now()-pauseAt;paused+=d;if(mode==='i')phaseEnd+=d;state='run';timer=setInterval(tick,150);$('pause').textContent='PAUSE';tick()}};
$('next').onclick=()=>newPhase(phase==='RUN'?'WALK':'RUN');
function end(savePrompt){
 clearInterval(timer);
 finishedDuration=Math.max(0,elapsed());
 state='finished';
 if(savePrompt){
   $('summary').textContent='Time: '+fmt(finishedDuration);
   $('dist').value='';
   $('active').classList.add('hidden');
   $('savePanel').hidden=false;$('savePanel').classList.remove('hidden');
 }else{
   returnToSetup();
 }
}
function returnToSetup(){
 clearInterval(timer);
 state='idle';
 $('savePanel').classList.add('hidden');$('savePanel').hidden=true;
 $('active').classList.add('hidden');
 $('setup').classList.remove('hidden');
 $('pause').textContent='PAUSE';
 $('screen').className='screen';
 $('phase').textContent='RUN';
 $('clock').textContent='00:00';
 $('sub').textContent='';
 finishedDuration=0;
}
$('finish').onclick=()=>end(true);
$('reset').onclick=()=>{if(confirm('Reset without saving?'))end(false)};
$('discard').onclick=()=>{
 returnToSetup();
};
$('save').onclick=()=>{
 const raw=String($('dist').value||'').trim().replace(',','.');
 const d=raw===''?null:Number(raw);
 const sec=finishedDuration;
 if(d!==null&&(!Number.isFinite(d)||d<0)){alert('Enter a valid distance in km, or leave it blank.');return}
 if(!Number.isFinite(sec)||sec<0){alert('Could not read workout time.');return}
 try{
   let h=JSON.parse(localStorage.getItem('rt-history')||'[]');
   if(!Array.isArray(h))h=[];
   h.unshift({at:new Date().toISOString(),sec:sec,km:d,mode:mode});
   localStorage.setItem('rt-history',JSON.stringify(h));
 }catch(err){
   alert('The run could not be saved on this device.');
   return;
 }
 returnToSetup();
 history();
};
function history(){let h=JSON.parse(localStorage.getItem('rt-history')||'[]');$('history').innerHTML=h.length?'':'<div style="color:#888;padding-top:10px">No saved runs yet.</div>';h.forEach((r,i)=>{let x=document.createElement('div');x.className='history';x.innerHTML='<span>#'+(h.length-i)+' · '+new Date(r.at).toLocaleDateString()+' · '+fmt(r.sec)+'</span><b>'+r.km.toFixed(2)+' km</b>';$('history').appendChild(x)})}$('savePanel').hidden=true;$('savePanel').classList.add('hidden');$('active').classList.add('hidden');$('setup').classList.remove('hidden');history();})();
</script></body></html>
