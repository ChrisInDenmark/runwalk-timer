<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Run Trainer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
.app{max-width:560px;margin:auto;padding:14px}
.title{text-align:center;font-size:25px;font-weight:800}.ver{text-align:center;color:#777;font-size:11px;margin-bottom:10px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.nav button,.btn{border:0;border-radius:10px;padding:10px;font-weight:800}
.nav button{background:#333;color:#ddd}.nav .on{background:#fff;color:#111}
.card{background:#1d1d1f;padding:12px;border-radius:16px;margin:10px 0}
.hidden{display:none!important}
.workoutTitle{text-align:center;font-size:28px;font-weight:900;margin:8px 0 12px}
label{display:block;color:#aaa;font-size:12px;margin:7px 0}
input,select{width:100%;padding:9px;margin-top:4px;border:0;border-radius:9px;font-size:15px;background:#fff;color:#111}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.start{width:100%;font-size:23px;padding:17px;background:#fff;color:#111}
.secondary{background:#666;color:#fff}.danger{background:#543030;color:#fff}
.screen{text-align:center;padding:28px 12px;border-radius:18px;background:#6d1717}
.screen.a{background:#155b2a}.screen.goal{background:#333}
.phase{font-size:46px;font-weight:900}.clock{font-size:82px;font-weight:900}.sub{margin-top:6px;color:#bbb}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.pause{grid-column:1/-1;font-size:28px;padding:22px;background:#fff;color:#111}
.finish{grid-column:1/-1;background:#555;color:#fff}
.history{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #333}
.muted{color:#999;font-size:12px}.empty{color:#888;padding:10px 0}
.note{font-size:11px;color:#888;margin-top:6px}
.settingsCompact .card{padding:8px 10px;margin:7px 0}
.settingsCompact label{margin:4px 0;font-size:11px}
.settingsCompact input,.settingsCompact select{padding:7px;font-size:14px;margin-top:2px}
.settingsCompact .btn{padding:8px;font-size:13px}
.settingsCompact .sectionTitle{font-weight:800;font-size:13px;margin-bottom:4px}
</style>
</head>
<body>
<div class="app">
<div class="title">Run Trainer</div><div class="ver">v0.9 friend test</div>
<div class="nav"><button id="navWorkout" class="on">Workout</button><button id="navSettings">Settings</button></div>

<section id="workoutPage">
<div id="workoutConfig">
<div id="workoutTitle" class="workoutTitle">Easy Start</div>

<div class="card">
<label>Goal time (minutes)<input id="goal" type="number" min="1" value="20"></label>

<div id="intervalFields">
<div class="row">
<label><span id="aLabel">Walk</span> minutes<select id="aMin"></select></label>
<label><span id="aLabel2">Walk</span> seconds<select id="aSec"></select></label>
</div>
<div class="row">
<label><span id="bLabel">Run</span> minutes<select id="bMin"></select></label>
<label><span id="bLabel2">Run</span> seconds<select id="bSec"></select></label>
</div>
</div>

<button id="start" class="btn start" style="margin-top:10px">START</button>
</div>
</div>

<div id="active" class="hidden">
<div id="screen" class="screen"><div id="phase" class="phase">RUN</div><div id="clock" class="clock">00:00</div><div id="sub" class="sub"></div></div>
<div class="controls"><button id="reset" class="btn">Reset</button><button id="next" class="btn">Next</button><button id="pause" class="btn pause">PAUSE</button><button id="finish" class="btn finish">FINISH</button></div>
</div>

<div id="savePanel" class="card hidden"><h2>Save activity?</h2><div id="saveSummary"></div><div class="actions"><button id="discard" class="btn secondary">Don't save</button><button id="saveActivity" class="btn">Save</button></div></div>
</section>

<section id="settingsPage" class="hidden settingsCompact">
<div class="card">
<div class="sectionTitle">Workout</div>
<label>Saved workout<select id="workoutSelect"></select></label>
<label>Name<input id="workoutName" type="text"></label>
<label>Mode<select id="mode"><option value="interval">Interval</option><option value="continuous">Continuous</option></select></label>
</div>

<div class="card">
<div class="sectionTitle">Phrases</div>
<label>Phrase preset
<select id="phrasePreset">
<option value="walkrun">Walk / Run</option>
<option value="easypush">Easy / Push it</option>
<option value="slapgas">Slap af / Gi den gas</option>
<option value="whoagiddy">Whoa baby / Giddy up</option>
<option value="jogsprint">Jog / Sprint</option>
<option value="custom">Custom</option>
</select>
</label>
<div class="row">
<label>Phase A<input id="aName" type="text" value="Walk"></label>
<label>Phase B<input id="bName" type="text" value="Run"></label>
</div>
</div>

<div class="card">
<div class="sectionTitle">Voice & announcements</div>
<label>Voice<select id="voice"><option value="">Default device voice</option></select></label>
<div class="row">
<button id="testVoice" class="btn secondary">Test voice</button>
<button id="openActivity" class="btn secondary">Activities</button>
</div>
<label><input id="halfwayOn" type="checkbox" checked style="width:auto"> Halfway</label>
<label><input id="goalOn" type="checkbox" checked style="width:auto"> Goal reached</label>
</div>

<div class="card">
<div class="actions"><button id="newWorkout" class="btn secondary">New</button><button id="deleteWorkout" class="btn danger">Delete</button></div>
<button id="saveSettings" class="btn start" style="font-size:16px;padding:10px;margin-top:8px">SAVE SETTINGS</button>
</div>

<div id="activityPanel" class="card hidden">
<div style="display:flex;justify-content:space-between;align-items:center"><strong>Saved activities</strong><button id="closeActivity" class="btn secondary">Close</button></div>
<div id="history"></div><button id="clearActivity" class="btn danger" style="width:100%;margin-top:8px">Clear activities</button>
</div>
</section>
</div>

<script>
(()=>{const $=id=>document.getElementById(id);
const phraseSets={
 walkrun:['Walk','Run'],
 easypush:['Easy','Push it'],
 slapgas:['Slap af','Gi den gas'],
 whoagiddy:['Whoa baby','Giddy up'],
 jogsprint:['Jog','Sprint']
};
const defaults=[
{id:'return',name:'Easy Start',mode:'interval',goal:20,aName:'Walk',aSec:60,bName:'Run',bSec:120,phrasePreset:'walkrun'},
{id:'steady',name:'Steady Run',mode:'continuous',goal:30,aName:'Easy',aSec:0,bName:'Run',bSec:0,phrasePreset:'custom'},
{id:'speed',name:'Speed Session',mode:'interval',goal:20,aName:'Jog',aSec:90,bName:'Sprint',bSec:30,phrasePreset:'jogsprint'}
];
let voices=[],currentId=null,state='idle',phase='B',startAt=0,pauseAt=0,pausedMs=0,phaseEnd=0,timer=null,counted=new Set(),finished=0,halfDone=false,goalDone=false,dbPromise=null;
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const elapsed=()=>((state==='paused'?pauseAt:Date.now())-startAt-pausedMs)/1000;

function presets(){try{let p=JSON.parse(localStorage.getItem('rt8-presets')||'null');if(Array.isArray(p)&&p.length)return p}catch(e){}localStorage.setItem('rt8-presets',JSON.stringify(defaults));return defaults.slice()}
function setPresets(p){localStorage.setItem('rt8-presets',JSON.stringify(p))}
function settings(){try{return JSON.parse(localStorage.getItem('rt8-settings')||'{}')}catch(e){return{}}}
function setSettings(s){localStorage.setItem('rt8-settings',JSON.stringify(s))}

function openDb(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{let r=indexedDB.open('RunTrainerDB',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('activities'))r.result.createObjectStore('activities',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
async function addActivity(x){let db=await openDb();return new Promise((res,rej)=>{let tx=db.transaction('activities','readwrite');tx.objectStore('activities').add(x);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function getActivities(){let db=await openDb();return new Promise((res,rej)=>{let tx=db.transaction('activities','readonly'),r=tx.objectStore('activities').getAll();r.onsuccess=()=>res((r.result||[]).sort((a,b)=>new Date(b.at)-new Date(a.at)));r.onerror=()=>rej(r.error)})}
async function clearActivities(){let db=await openDb();return new Promise((res,rej)=>{let tx=db.transaction('activities','readwrite');tx.objectStore('activities').clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

['aMin','bMin'].forEach(id=>{for(let i=0;i<=10;i++)$(id).add(new Option(i,i))});
['aSec','bSec'].forEach(id=>{for(let s=0;s<60;s+=10)$(id).add(new Option(String(s).padStart(2,'0'),s))});

function populateVoices(){voices=speechSynthesis.getVoices()||[];let saved=settings().voice||'';$('voice').innerHTML='<option value="">Default device voice</option>';voices.forEach((v,i)=>{if(/^en|^da/i.test(v.lang))$('voice').add(new Option(v.name+' ('+v.lang+')',i))});if(saved&&[...$('voice').options].some(o=>o.value===saved))$('voice').value=saved}
if('speechSynthesis'in window){populateVoices();speechSynthesis.onvoiceschanged=populateVoices;setTimeout(populateVoices,500)}
function say(t){try{let u=new SpeechSynthesisUtterance(t),v=$('voice').value;if(v!==''&&voices[+v])u.voice=voices[+v];u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function beep(f=760){try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.1;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.1);o.stop(c.currentTime+.1)}catch(e){}}

function show(page){$('workoutPage').classList.toggle('hidden',page!=='workout');$('settingsPage').classList.toggle('hidden',page!=='settings');$('navWorkout').classList.toggle('on',page==='workout');$('navSettings').classList.toggle('on',page==='settings')}
$('navWorkout').onclick=()=>show('workout');$('navSettings').onclick=()=>show('settings');

function refreshSelect(){let p=presets(),s=$('workoutSelect');s.innerHTML='';p.forEach(x=>s.add(new Option(x.name,x.id)));let saved=settings().currentId;currentId=p.some(x=>x.id===saved)?saved:p[0].id;s.value=currentId;loadWorkout(currentId)}
function detectPhrasePreset(a,b){
 for(const [k,v] of Object.entries(phraseSets)) if(v[0]===a&&v[1]===b) return k;
 return 'custom';
}
function loadWorkout(id){
 let p=presets().find(x=>x.id===id);if(!p)return;
 currentId=id;$('workoutName').value=p.name;$('mode').value=p.mode;$('goal').value=p.goal;$('aName').value=p.aName||'Easy';$('bName').value=p.bName||'Hard';
 $('aMin').value=Math.floor((p.aSec||0)/60);$('aSec').value=(p.aSec||0)%60;$('bMin').value=Math.floor((p.bSec||0)/60);$('bSec').value=(p.bSec||0)%60;
 $('phrasePreset').value=p.phrasePreset||detectPhrasePreset(p.aName,p.bName);applyTitleAndLabels();updateMode();
}
function applyTitleAndLabels(){
 $('workoutTitle').textContent=$('workoutName').value.trim()||'Workout';
 const a=$('aName').value.trim()||'Phase A',b=$('bName').value.trim()||'Phase B';
 $('aLabel').textContent=a;$('aLabel2').textContent=a;$('bLabel').textContent=b;$('bLabel2').textContent=b;
}
$('workoutSelect').onchange=()=>{loadWorkout($('workoutSelect').value);let s=settings();s.currentId=$('workoutSelect').value;setSettings(s)}
$('mode').onchange=updateMode;
function updateMode(){$('intervalFields').classList.toggle('hidden',$('mode').value!=='interval')}
$('phrasePreset').onchange=()=>{
 let k=$('phrasePreset').value;if(k!=='custom'&&phraseSets[k]){$('aName').value=phraseSets[k][0];$('bName').value=phraseSets[k][1];applyTitleAndLabels()}
};
$('aName').oninput=()=>{$('phrasePreset').value=detectPhrasePreset($('aName').value,$('bName').value);applyTitleAndLabels()}
$('bName').oninput=()=>{$('phrasePreset').value=detectPhrasePreset($('aName').value,$('bName').value);applyTitleAndLabels()}
$('workoutName').oninput=applyTitleAndLabels;

function saveAll(){
 let a=+$('aMin').value*60 + +$('aSec').value,b=+$('bMin').value*60 + +$('bSec').value;
 if($('mode').value==='interval'&&(a<=0||b<=0)){alert('Both interval phases need a time.');return false}
 let p=presets(),i=p.findIndex(x=>x.id===currentId),obj={id:currentId,name:$('workoutName').value.trim()||'Workout',mode:$('mode').value,goal:+$('goal').value,aName:$('aName').value.trim()||'Easy',aSec:a,bName:$('bName').value.trim()||'Hard',bSec:b,phrasePreset:$('phrasePreset').value};
 if(i>=0)p[i]=obj;else p.push(obj);setPresets(p);
 let s=settings();s.currentId=currentId;s.voice=$('voice').value;s.halfwayOn=$('halfwayOn').checked;s.goalOn=$('goalOn').checked;setSettings(s);
 refreshSelect();return true;
}
$('saveSettings').onclick=()=>{if(saveAll())show('workout')};

$('newWorkout').onclick=()=>{let p=presets(),id='custom-'+Date.now();p.push({id,name:'New Workout',mode:'interval',goal:20,aName:'Easy',aSec:60,bName:'Hard',bSec:60,phrasePreset:'custom'});setPresets(p);let s=settings();s.currentId=id;setSettings(s);refreshSelect();show('settings')};
$('deleteWorkout').onclick=()=>{let p=presets();if(p.length<=1)return alert('Keep at least one workout.');if(!confirm('Delete selected workout?'))return;p=p.filter(x=>x.id!==currentId);setPresets(p);let s=settings();s.currentId=p[0].id;setSettings(s);refreshSelect()};

$('voice').onchange=()=>{let s=settings();s.voice=$('voice').value;setSettings(s)}
const initialSettings=settings();$('halfwayOn').checked=initialSettings.halfwayOn!==false;$('goalOn').checked=initialSettings.goalOn!==false;
$('halfwayOn').onchange=()=>{let s=settings();s.halfwayOn=$('halfwayOn').checked;setSettings(s)}
$('goalOn').onchange=()=>{let s=settings();s.goalOn=$('goalOn').checked;setSettings(s)}
$('testVoice').onclick=()=>{let a=$('aName').value.trim()||'Easy',b=$('bName').value.trim()||'Hard';if($('mode').value==='interval'){say(a);setTimeout(()=>say(b),900)}else say(b)}

function current(){return presets().find(x=>x.id===currentId)||presets()[0]}
function startPhase(which,p){phase=which;let d=which==='A'?p.aSec:p.bSec;phaseEnd=Date.now()+d*1000;counted.clear();beep(900);setTimeout(()=>say(which==='A'?p.aName:p.bName),90)}
$('start').onclick=()=>{
 if(!saveAll())return;
 let p=current();startAt=Date.now();pausedMs=0;finished=0;halfDone=false;goalDone=false;state='run';
 $('workoutConfig').classList.add('hidden');$('savePanel').classList.add('hidden');$('active').classList.remove('hidden');$('next').classList.toggle('hidden',p.mode!=='interval');
 if(p.mode==='interval')startPhase('B',p);else say(p.bName||'Run');
 timer=setInterval(()=>tick(p),150);tick(p);
};
function tick(p){
 if(state!=='run')return;
 let e=elapsed(),goal=p.goal*60,s=settings();
 if(!halfDone&&s.halfwayOn!==false&&e>=goal/2){halfDone=true;say('Halfway')}
 if(!goalDone&&s.goalOn!==false&&e>=goal){goalDone=true;beep(1000);setTimeout(()=>say('Goal reached'),100)}
 if(p.mode==='continuous'){
   $('screen').className='screen '+(goalDone?'goal':'');$('phase').textContent=goalDone?'GOAL REACHED':(p.bName||'RUN').toUpperCase();$('clock').textContent=fmt(e);$('sub').textContent=goalDone?'Keep going — finish when ready':'Goal '+fmt(goal)
 }else{
   let left=(phaseEnd-Date.now())/1000;if(left<=0){startPhase(phase==='A'?'B':'A',p);left=phase==='A'?p.aSec:p.bSec}
   if(left<=3&&left>0){let n=Math.ceil(left);if(!counted.has(n)){counted.add(n);beep(n===1?1050:700)}}
   let label=phase==='A'?p.aName:p.bName;$('screen').className='screen '+(phase==='A'?'a':'');$('phase').textContent=label.toUpperCase();$('clock').textContent=fmt(left);$('sub').textContent=(goalDone?'Goal reached • ':'Elapsed ')+fmt(e)
 }
}
$('pause').onclick=()=>{let p=current();if(state==='run'){state='paused';pauseAt=Date.now();clearInterval(timer);$('pause').textContent='RESUME'}else if(state==='paused'){let d=Date.now()-pauseAt;pausedMs+=d;if(p.mode==='interval')phaseEnd+=d;state='run';timer=setInterval(()=>tick(p),150);$('pause').textContent='PAUSE';tick(p)}}
$('next').onclick=()=>{let p=current();if(p.mode==='interval'&&(state==='run'||state==='paused'))startPhase(phase==='A'?'B':'A',p)}
function finish(savePrompt){clearInterval(timer);finished=Math.max(0,elapsed());state='finished';$('active').classList.add('hidden');if(savePrompt){let p=current();$('saveSummary').textContent='Time: '+fmt(finished)+' · '+p.name;$('savePanel').classList.remove('hidden')}else resetUI()}
function resetUI(){clearInterval(timer);state='idle';finished=0;$('savePanel').classList.add('hidden');$('active').classList.add('hidden');$('workoutConfig').classList.remove('hidden');$('pause').textContent='PAUSE'}
$('finish').onclick=()=>finish(true);$('reset').onclick=()=>{if(confirm('Reset without saving?'))finish(false)};$('discard').onclick=resetUI
$('saveActivity').onclick=async()=>{let p=current();try{await addActivity({at:new Date().toISOString(),sec:finished,presetName:p.name,mode:p.mode})}catch(e){return alert('Could not save activity.')}resetUI();show('settings');$('activityPanel').classList.remove('hidden');renderHistory()}
async function renderHistory(){let h=[];try{h=await getActivities()}catch(e){$('history').innerHTML='<div class="empty">Could not read activities.</div>';return}$('history').innerHTML='';if(!h.length){$('history').innerHTML='<div class="empty">No saved activities yet.</div>';return}h.forEach(r=>{let d=new Date(r.at),row=document.createElement('div');row.className='history';row.innerHTML='<div><strong>'+r.presetName+'</strong><div class="muted">'+d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})+' · '+(r.mode==='interval'?'Interval':'Continuous')+'</div></div><div><strong>'+fmt(r.sec)+'</strong></div>';$('history').appendChild(row)})}
$('openActivity').onclick=()=>{$('activityPanel').classList.remove('hidden');renderHistory()}
$('closeActivity').onclick=()=>$('activityPanel').classList.add('hidden')
$('clearActivity').onclick=async()=>{if(confirm('Clear all saved activities?')){await clearActivities();renderHistory()}}

(async()=>{try{await openDb()}catch(e){}refreshSelect()})();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
})();</script>
</body></html>
